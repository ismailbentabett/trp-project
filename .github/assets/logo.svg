<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">TRP CMS logo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <!-- Modular layout: header bar, sidebar and two content blocks -->
  <g fill="#FFFFFF">
    <rect x="60" y="60" width="136" height="36" rx="10"/>
    <rect x="60" y="108" width="52" height="88" rx="10"/>
    <rect x="124" y="108" width="72" height="38" rx="10"/>
    <rect x="124" y="158" width="72" height="38" rx="10" fill-opacity="0.72"/>
  </g>
</svg>
